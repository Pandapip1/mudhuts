[package]
name = "mudhuts"
edition.workspace = true
version.workspace = true

[dependencies]
mudhuts-term = { path = "../mudhuts-term" }
mudhuts-protocols = { path = "../mudhuts-protocols", features = ["server"] }
alacritty_terminal = "0.26"
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-journald = "0.3"
xcursor = "0.3.3"
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "4cf0b62028039661477d482ec4758b687d8f4392", default-features = false }

[dependencies.smithay]
workspace = true
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "backend_session_libseat",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
]

[dev-dependencies]
# In-process client half of `test_support`'s real xdg_shell handshake —
# lets unit tests construct genuine `smithay::desktop::Window`s (needed
# by anything operating on Main Windows/Floating Windows/Alerts) without
# a live compositor, the same protocol crates `mudhuts-test-client`
# already uses against a real one.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
