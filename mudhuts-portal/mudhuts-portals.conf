# xdg-desktop-portal per-desktop portal preference file.
#
# Install to one of (checked in this order by xdg-desktop-portal, see
# `man 5 portals.conf`):
#   $XDG_CONFIG_HOME/xdg-desktop-portal/mudhuts-portals.conf   (per-user)
#   /etc/xdg-desktop-portal/mudhuts-portals.conf                (system)
#   /usr/share/xdg-desktop-portal/mudhuts-portals.conf          (packaged default)
#
# The "mudhuts-" filename prefix matches `$XDG_CURRENT_DESKTOP` lowercased
# (xdg-desktop-portal tries "${desktop}-portals.conf" for each entry in
# XDG_CURRENT_DESKTOP before falling back to the generic "portals.conf")
# — so mudhuts' session startup needs to `export XDG_CURRENT_DESKTOP=mudhuts`
# (it doesn't currently set this itself; see this crate's top-level
# report/README) for this file to be picked up automatically. Renaming it
# to plain `portals.conf` works regardless of XDG_CURRENT_DESKTOP, at the
# cost of applying even to sessions that aren't mudhuts.
#
# This routes Settings/Screenshot/ScreenCast to mudhuts-portal (the
# "mudhuts" backend, named by mudhuts.portal's own filename stem) and
# leaves everything else — FileChooser included — to whatever the
# system's default GTK/KDE portal backend is. Adjust `default=` if this
# system doesn't have a `gtk` backend installed (e.g. `kde`, or a specific
# other backend name — check /usr/share/xdg-desktop-portal/portals/ for
# what's actually available).

[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=mudhuts
org.freedesktop.impl.portal.Screenshot=mudhuts
org.freedesktop.impl.portal.ScreenCast=mudhuts
